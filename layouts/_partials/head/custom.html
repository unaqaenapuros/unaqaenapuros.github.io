<style>
  .left-sidebar {
    --sidebar-avatar-size: 180px;
  }

  /* Swap the sidebar avatar between the light and dark logo depending
     on the active color scheme. The theme sets data-scheme="dark" on
     <html> both for the manual toggle and the OS preference. */
  .site-avatar .site-logo {
    content: url("/img/logo/avatar-light.svg");
  }
  html[data-scheme="dark"] .site-avatar .site-logo {
    content: url("/img/logo/avatar-dark.svg");
  }
</style>

{{/* Favicons (logo v2) */}}
<link rel="icon" href="/img/logo/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/logo/apple-touch-icon.png">
<link rel="icon" sizes="192x192" href="/img/logo/icono-192.png">

{{/* Umami analytics — only loaded on the deployed site, not in local dev */}}
{{ if hugo.IsProduction }}
<script defer src="https://cloud.umami.is/script.js" data-website-id="b7c31836-3907-42b0-aef0-eed57eadef78"></script>
{{ end }}
