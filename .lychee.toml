# Do not suppress whole domains, except sdos.es: the author decided on 2026-11-02 to stop checking any
# link or image on that old company site (including the post 030 Jenkins image, kept as it is).
exclude = [
  '^https?://(www\.)?sdos\.es([/?#]|$)',
  # Local servers used as runnable examples inside posts and never resolve in CI.
  '^http://localhost:\d+/?$',
  # The automated check returned 999/403 for these exact URLs. The target content is not independently verified.
  # Only www.sdos.es (redirects to ALTEN) and www.i-funbox.com (Cloudflare challenge) were opened in a real browser on 2026-10-27.
  '^https://www\.linkedin\.com/in/estefafdez/$',
  '^https://www\.linkedin\.com/in/francisco-fern%C3%A1ndez-gonz%C3%A1lez-71b178115/$',
  '^https://medium\.com/qawolf/techniques-for-testing-generative-ai-applications-344ef53bb13a$',
  '^http://downloads\.sonarsource\.com/eclipse/eclipse/$',
  '^http://www\.i-funbox\.com/$',
  # Retired or unreachable services the author chose to ignore on 2026-10-27 (exact URLs only).
  '^https://evernote\.com/intl/es/products/skitch$',
  '^https://appworld\.blackberry\.com/webstore/\?lang=es$',
  # Unreachable since at least 2026-10-27 and no verified replacement. The author chose to ignore it on 2026-10-27 (exact URL only).
  '^https://www\.qacommunity\.es/$',
]
# Resolve root-relative links (/img/..., /2018/...) against the live site.
base_url = "https://unaqaenapuros.com"
max_concurrency = 4
max_retries = 1
timeout = 20
