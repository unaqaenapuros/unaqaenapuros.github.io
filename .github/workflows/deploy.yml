name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily 09:30 Madrid trigger comes from an external cron (cron-job.org)
  # hitting the repository_dispatch API. GH's own `schedule` was dropped:
  # it ran 5-7h late every day, so posts never went out at 09:30.
  repository_dispatch:
    types: [publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      post_url: ${{ steps.check.outputs.post_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Hugo
        if: github.event_name == 'repository_dispatch'
        run: bash scripts/install_hugo.sh

      - name: Find eligible posts missing from the live sitemap
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "repository_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/pending_posts.py --output "$GITHUB_OUTPUT" > pending.json
            if [ "$(cat pending.json)" != '[]' ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: bash scripts/install_hugo.sh

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build the site
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  purge:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: /tmp/pages-artifact
      - name: Extract deployed artifact
        run: |
          mkdir public
          tar -xf /tmp/pages-artifact/artifact.tar -C public
      - name: Purge generated URLs
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/purge_cache.py

  notify:
    needs: [check, build, deploy, purge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: "Una QA en Apuros — blog <${{ secrets.GMAIL_ADDRESS }}>"
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: >-
            ${{ needs.check.result != 'success' && '❌ Blog publication check failed'
              || needs.check.outputs.should_deploy != 'true' && '🔍 Blog control check - all OK'
              || needs.deploy.result != 'success' && '❌ Blog deploy failed'
              || needs.purge.result != 'success' && '⚠️ Site deployed; cache purge failed'
              || needs.check.outputs.post_url != '' && '✅ Post published'
              || '✅ Changes made to the site - build OK' }}
          body: |
            ${{ needs.check.result != 'success' && 'Publication check failed. Inspect the run before retrying.'
              || needs.check.outputs.should_deploy != 'true' && 'No eligible posts missing from the sitemap.'
              || needs.deploy.result != 'success' && 'Deploy failed.'
              || needs.purge.result != 'success' && 'Site published, but Cloudflare cache purge failed.'
              || needs.check.outputs.post_url != '' && format('Post published: {0}', needs.check.outputs.post_url)
              || 'Changes made to the site — build OK.' }}

            Build: ${{ needs.build.result }}
            Cache purge: ${{ needs.purge.result }}
            Deploy: ${{ needs.deploy.result }}

            Site: https://unaqaenapuros.com/
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
