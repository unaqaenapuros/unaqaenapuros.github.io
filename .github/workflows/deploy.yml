name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Scheduled posts always use 09:30 Madrid time. Two entries cover
    # both DST states (CEST = UTC+2 in summer, CET = UTC+1 in winter)
    # so it hits 09:30 local year-round with no manual changes needed.
    - cron: "30 7 * * *"  # 09:30 CEST (summer)
    - cron: "30 8 * * *"  # 09:30 CET (winter)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      post_url: ${{ steps.check.outputs.post_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for posts publishing today
        id: check
        run: |
          # On push/manual dispatch always deploy. On the daily cron, only
          # deploy if a post's date matches today (Madrid) — otherwise the
          # cron would rebuild/deploy every day for nothing new.
          # ponytail: matches exact today only, doesn't catch a missed run
          # from a prior failed cron; re-run manually (workflow_dispatch) if that happens.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both cron entries fire every day; only the one matching the
          # current DST state lands on 09:xx Madrid time. Skip the other
          # so a single run per day gets past this point.
          if [ "$(TZ=Europe/Madrid date +%H)" != "09" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Europe/Madrid date +%F)
          post_file=$(grep -rlP "^date: '?${today}" content/posts/ | head -1)
          if [ -n "$post_file" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "post_url=$(grep -oP '^url: \K.*' "$post_file")" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        run: |
          curl -sS --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  notify:
    needs: [check, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Una QA en Apuros — blog
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: >-
            ${{ needs.check.outputs.should_deploy != 'true' && '🔍 Blog control check - all OK'
              || needs.deploy.result != 'success' && '❌ Blog deploy failed'
              || needs.check.outputs.post_url != '' && '✅ Post published'
              || '✅ Changes made to the site - build OK' }}
          body: |
            ${{ needs.check.outputs.should_deploy != 'true' && 'Control check: no posts to publish today. All OK.'
              || needs.deploy.result != 'success' && 'Deploy failed.'
              || needs.check.outputs.post_url != '' && format('Post published :) — https://unaqaenapuros.com{0}', needs.check.outputs.post_url)
              || 'Changes made to the site — build OK.' }}

            Build: ${{ needs.build.result }}
            Deploy: ${{ needs.deploy.result }}

            Site: https://unaqaenapuros.com/
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
