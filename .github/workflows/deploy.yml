name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily 09:30 Madrid trigger comes from an external cron (cron-job.org)
  # hitting the repository_dispatch API. GH's own `schedule` was dropped:
  # it ran 5-7h late every day, so posts never went out at 09:30.
  repository_dispatch:
    types: [publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      post_url: ${{ steps.check.outputs.post_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Hugo
        if: github.event_name == 'repository_dispatch'
        run: bash scripts/install_hugo.sh

      - name: Find eligible posts missing from the live sitemap
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "repository_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/pending_posts.py --output "$GITHUB_OUTPUT" > pending.json
            if [ "$(cat pending.json)" != '[]' ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        run: |
          curl -sS --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  notify:
    needs: [check, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Una QA en Apuros — blog
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: >-
            ${{ needs.check.result != 'success' && '❌ Blog publication check failed'
              || needs.check.outputs.should_deploy != 'true' && '🔍 Blog control check - all OK'
              || needs.deploy.result != 'success' && '❌ Blog deploy failed'
              || needs.check.outputs.post_url != '' && '✅ Post published'
              || '✅ Changes made to the site - build OK' }}
          body: |
            ${{ needs.check.result != 'success' && 'Publication check failed. Inspect the run before retrying.'
              || needs.check.outputs.should_deploy != 'true' && 'No eligible posts missing from the sitemap.'
              || needs.deploy.result != 'success' && 'Deploy failed.'
              || needs.check.outputs.post_url != '' && format('Post published: {0}', needs.check.outputs.post_url)
              || 'Changes made to the site — build OK.' }}

            Build: ${{ needs.build.result }}
            Deploy: ${{ needs.deploy.result }}

            Site: https://unaqaenapuros.com/
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
