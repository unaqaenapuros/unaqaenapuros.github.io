name: External link report
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    # Report legacy failures before making this a required gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Skip posts scheduled for the future
        id: scheduled
        run: |
          args=""
          today=$(date +%F)
          for f in content/posts/new-posts/*.md; do
            d=$(grep -m1 '^date:' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1)
            if [ -n "$d" ] && [[ "$d" > "$today" ]]; then
              args="$args --exclude-path $f"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --scheme http --scheme https ${{ steps.scheduled.outputs.args }} 'content/**/*.md'
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-report
          path: lychee/out.md
