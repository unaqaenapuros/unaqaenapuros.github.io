baseURL = "https://unaqaenapuros.com/"
theme = "stack"
title = "Una QA en Apuros"
locale = "en-us"
defaultContentLanguage = "en"
hasCJKLanguage = false

enableRobotsTXT = true
enableEmoji = true

# Keep auto-generated titles (category/tag widget names) exactly as
# written in front matter (lowercase, hyphenated) instead of Hugo's
# default Title Case capitalization.
titleCaseStyle = "none"

[pagination]
  pagerSize = 6

[[menu.social]]
  weight = 10
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/estefafdez"
  [menu.social.params]
    icon = "brand-github"

[[menu.social]]
  weight = 20
  identifier = "linkedin"
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/estefafdez"
  [menu.social.params]
    icon = "linkedin"

[[menu.social]]
  weight = 25
  identifier = "twitter"
  name = "Twitter / X"
  url = "https://twitter.com/estefafdez"
  [menu.social.params]
    icon = "brand-twitter"

[[menu.social]]
  weight = 30
  identifier = "website"
  name = "Website"
  url = "https://estefafdez.com/"
  [menu.social.params]
    icon = "link"

[[menu.social]]
  weight = 40
  identifier = "rss"
  name = "RSS"
  url = "/index.xml"
  [menu.social.params]
    icon = "rss"

[params]
  mainSections = ["posts"]
  rssFullContent = true

  [params.footer]
    since = 2026

  [params.sidebar]
    subtitle = "QA, Testing, IA, Playwright, Selenium, Appium, Cypress y todo… con calidad!"
    avatar = "img/logo/avatar-light.svg"

  [params.article]
    [params.article.license]
      enabled = false

  [params.widgets]
    homepage = [
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.comments]
    enabled = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4

[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 200

[outputs]
  home = ["HTML", "RSS"]
